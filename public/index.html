<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oil &amp; Energy KPI Tracker</title>
  <style>
    :root {
      --bg-primary: #0f1923;
      --bg-secondary: #1a2733;
      --bg-card: #1e2d3d;
      --border: #2a3f52;
      --text-primary: #e8edf2;
      --text-secondary: #8899aa;
      --accent: #3b82f6;
      --green: #10b981;
      --red: #ef4444;
      --yellow: #f59e0b;
      --green-bg: rgba(16, 185, 129, 0.1);
      --red-bg: rgba(239, 68, 68, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
    }

    .header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 20px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header h1 .icon { font-size: 26px; }

    .header-meta {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .header-meta .date {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .filter-bar {
      background: var(--bg-secondary);
      padding: 12px 32px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
    }

    .filter-btn {
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .filter-btn:hover { border-color: var(--accent); color: var(--text-primary); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

    .summary-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      padding: 24px 32px;
    }

    .summary-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
    }

    .summary-card .label {
      font-size: 12px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .summary-card .value {
      font-size: 26px;
      font-weight: 700;
    }

    .summary-card .sub {
      font-size: 13px;
      margin-top: 4px;
    }

    .container {
      padding: 0 32px 32px;
    }

    .kpi-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--bg-card);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .kpi-table thead th {
      background: var(--bg-secondary);
      padding: 14px 16px;
      text-align: left;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    .kpi-table thead th.right { text-align: right; }

    .kpi-table tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }

    .kpi-table tbody tr:last-child { border-bottom: none; }
    .kpi-table tbody tr:hover { background: rgba(59, 130, 246, 0.05); }

    .kpi-table td {
      padding: 14px 16px;
      font-size: 14px;
    }

    .kpi-table td.right { text-align: right; font-variant-numeric: tabular-nums; }

    .product-cell {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .product-name { font-weight: 600; }
    .product-category { font-size: 12px; color: var(--text-secondary); }

    .price { font-weight: 600; font-size: 15px; }
    .unit { font-size: 11px; color: var(--text-secondary); margin-left: 2px; }

    .change {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
    }

    .change.up {
      color: var(--green);
      background: var(--green-bg);
    }

    .change.down {
      color: var(--red);
      background: var(--red-bg);
    }

    .change.flat {
      color: var(--text-secondary);
      background: rgba(136, 153, 170, 0.1);
    }

    .arrow { font-size: 11px; }

    .sparkline-cell {
      width: 120px;
    }

    .sparkline {
      width: 110px;
      height: 32px;
    }

    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 80px 0;
      color: var(--text-secondary);
      font-size: 16px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--text-primary);
    }

    /* Expandable securities row */
    .product-row { cursor: pointer; }
    .product-row:hover { background: rgba(59, 130, 246, 0.08); }

    .expand-icon {
      display: inline-block;
      width: 16px;
      font-size: 10px;
      color: var(--text-secondary);
      transition: transform 0.2s;
      margin-right: 6px;
    }

    .expand-icon.open { transform: rotate(90deg); }

    .securities-row td {
      padding: 0 !important;
      background: var(--bg-secondary);
    }

    .securities-panel {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.3s ease;
    }

    .securities-panel.open {
      max-height: 600px;
    }

    .securities-inner {
      padding: 16px 20px 20px;
    }

    .securities-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .securities-header h4 {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .securities-legend {
      display: flex;
      gap: 12px;
      font-size: 11px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--text-secondary);
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .legend-dot.stock { background: var(--accent); }
    .legend-dot.etf { background: var(--yellow); }

    .securities-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
    }

    .sec-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .sec-table thead th {
      text-align: left;
      padding: 8px 10px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    .sec-table thead th.right { text-align: right; }

    .sec-table tbody tr {
      border-bottom: 1px solid rgba(42, 63, 82, 0.5);
    }

    .sec-table tbody tr:last-child { border-bottom: none; }

    .sec-table td {
      padding: 8px 10px;
      vertical-align: middle;
    }

    .sec-table td.right { text-align: right; font-variant-numeric: tabular-nums; }

    .sec-ticker-cell {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .security-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 22px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.3px;
      flex-shrink: 0;
    }

    .security-badge.stock { background: rgba(59, 130, 246, 0.15); color: var(--accent); }
    .security-badge.etf   { background: rgba(245, 158, 11, 0.15); color: var(--yellow); }

    .sec-ticker {
      font-weight: 700;
      font-size: 13px;
      color: var(--text-primary);
    }

    .sec-name {
      font-size: 12px;
      color: var(--text-secondary);
      max-width: 200px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sec-price {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .sa-rating {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    .sa-rating.buy { background: var(--green-bg); color: var(--green); }
    .sa-rating.hold { background: rgba(245, 158, 11, 0.1); color: var(--yellow); }
    .sa-rating.sell { background: var(--red-bg); color: var(--red); }

    .sa-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 11px;
      opacity: 0.8;
    }

    .sa-link:hover { opacity: 1; text-decoration: underline; }

    .sec-data-source {
      text-align: right;
      padding: 8px 0 0;
      font-size: 11px;
      color: var(--text-secondary);
      opacity: 0.6;
    }

    @media (max-width: 768px) {
      .header { padding: 16px; }
      .summary-row { padding: 16px; }
      .container { padding: 0 16px 16px; }
      .filter-bar { padding: 10px 16px; }
      .kpi-table { font-size: 13px; }
      .kpi-table td, .kpi-table th { padding: 10px 8px; }
      .sparkline-cell { display: none; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1><span class="icon">&#9951;</span> Oil &amp; Energy KPI Tracker</h1>
    <div class="header-meta">
      <span class="date" id="ref-date"></span>
    </div>
  </div>

  <div class="filter-bar" id="filter-bar"></div>

  <div class="summary-row" id="summary-row"></div>

  <div class="container">
    <h2 class="section-title">Product Performance</h2>
    <div id="table-container">
      <div class="loading">Loading KPI data...</div>
    </div>
  </div>

  <script>
    let allData = null;
    let allProducts = null;
    let priceHistory = null;
    let securitiesData = null;
    let secPerfData = null;
    let activeFilter = 'All';
    let expandedRows = new Set();

    async function loadData() {
      const [kpiRes, productRes, historyRes, secRes, secPerfRes] = await Promise.all([
        fetch('/api/kpis'),
        fetch('/api/products'),
        fetch('/api/prices'),
        fetch('/api/securities'),
        fetch('/api/securities-performance')
      ]);
      allData = await kpiRes.json();
      allProducts = await productRes.json();
      priceHistory = await historyRes.json();
      securitiesData = await secRes.json();
      secPerfData = secPerfRes.ok ? await secPerfRes.json() : null;
      render();
    }

    function formatPct(val) {
      if (val == null) return '<span class="change flat">N/A</span>';
      const dir = val > 0.05 ? 'up' : val < -0.05 ? 'down' : 'flat';
      const arrow = dir === 'up' ? '&#9650;' : dir === 'down' ? '&#9660;' : '&#9644;';
      const sign = val > 0 ? '+' : '';
      return `<span class="change ${dir}"><span class="arrow">${arrow}</span>${sign}${val.toFixed(2)}%</span>`;
    }

    function formatPrice(price, unit) {
      if (price == null) return '-';
      const decimals = price >= 100 ? 2 : price >= 10 ? 2 : 3;
      return `<span class="price">${price.toFixed(decimals)}</span><span class="unit">${unit}</span>`;
    }

    function drawSparkline(canvas, data) {
      if (!data || data.length < 2) return;
      const ctx = canvas.getContext('2d');
      const w = canvas.width = 110;
      const h = canvas.height = 32;
      const prices = data.slice(-30).map(d => d.price);
      const min = Math.min(...prices);
      const max = Math.max(...prices);
      const range = max - min || 1;

      const isUp = prices[prices.length - 1] >= prices[0];
      ctx.strokeStyle = isUp ? '#10b981' : '#ef4444';
      ctx.lineWidth = 1.5;
      ctx.beginPath();

      prices.forEach((p, i) => {
        const x = (i / (prices.length - 1)) * w;
        const y = h - ((p - min) / range) * (h - 4) - 2;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
    }

    function getCategories() {
      return ['All', ...new Set(allProducts.map(p => p.category))];
    }

    function getFilteredProducts() {
      if (activeFilter === 'All') return allProducts;
      return allProducts.filter(p => p.category === activeFilter);
    }

    function computeSummary(filtered) {
      let gainers = 0, losers = 0, totalWow = 0, count = 0;
      for (const p of filtered) {
        const kpi = allData[p.id];
        if (!kpi || kpi.wow.pctChange == null) continue;
        if (kpi.wow.pctChange > 0.05) gainers++;
        else if (kpi.wow.pctChange < -0.05) losers++;
        totalWow += kpi.wow.pctChange;
        count++;
      }
      return {
        total: filtered.length,
        gainers,
        losers,
        avgWow: count > 0 ? totalWow / count : 0
      };
    }

    function renderFilters() {
      const bar = document.getElementById('filter-bar');
      bar.innerHTML = getCategories().map(cat =>
        `<button class="filter-btn ${cat === activeFilter ? 'active' : ''}" data-cat="${cat}">${cat}</button>`
      ).join('');
      bar.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeFilter = btn.dataset.cat;
          render();
        });
      });
    }

    function renderSummary(filtered) {
      const s = computeSummary(filtered);
      const row = document.getElementById('summary-row');
      row.innerHTML = `
        <div class="summary-card">
          <div class="label">Products Tracked</div>
          <div class="value">${s.total}</div>
          <div class="sub" style="color:var(--text-secondary)">${activeFilter === 'All' ? 'All categories' : activeFilter}</div>
        </div>
        <div class="summary-card">
          <div class="label">Weekly Gainers</div>
          <div class="value" style="color:var(--green)">${s.gainers}</div>
          <div class="sub" style="color:var(--green)">products up WoW</div>
        </div>
        <div class="summary-card">
          <div class="label">Weekly Losers</div>
          <div class="value" style="color:var(--red)">${s.losers}</div>
          <div class="sub" style="color:var(--red)">products down WoW</div>
        </div>
        <div class="summary-card">
          <div class="label">Avg Weekly Change</div>
          <div class="value">${formatPct(s.avgWow)}</div>
          <div class="sub" style="color:var(--text-secondary)">across filtered products</div>
        </div>
      `;
    }

    function formatSecPrice(val) {
      if (val == null) return '-';
      return '$' + val.toFixed(2);
    }

    function formatSmallPct(val) {
      if (val == null) return '<span class="change flat" style="padding:2px 6px;font-size:11px">N/A</span>';
      const dir = val > 0.05 ? 'up' : val < -0.05 ? 'down' : 'flat';
      const arrow = dir === 'up' ? '&#9650;' : dir === 'down' ? '&#9660;' : '&#9644;';
      const sign = val > 0 ? '+' : '';
      return `<span class="change ${dir}" style="padding:2px 6px;font-size:11px"><span class="arrow">${arrow}</span>${sign}${val.toFixed(2)}%</span>`;
    }

    function ratingClass(rating) {
      if (!rating) return 'hold';
      const r = rating.toLowerCase();
      if (r.includes('buy')) return 'buy';
      if (r.includes('sell')) return 'sell';
      return 'hold';
    }

    function getSecPerf(ticker) {
      if (!secPerfData || !secPerfData.tickers) return null;
      return secPerfData.tickers[ticker] || null;
    }

    function renderSecuritiesPanel(productId) {
      const sec = securitiesData[productId];
      if (!sec) return '<div class="securities-inner"><em style="color:var(--text-secondary)">No related securities data</em></div>';

      const isOpen = expandedRows.has(productId);
      let html = `<div class="securities-panel ${isOpen ? 'open' : ''}" id="panel-${productId}">`;
      html += '<div class="securities-inner">';
      html += `<div class="securities-header">
        <h4>Top 10 Related Stocks &amp; ETFs — Seeking Alpha Data</h4>
        <div class="securities-legend">
          <span class="legend-item"><span class="legend-dot stock" style="width:8px;height:8px;border-radius:50%;background:var(--accent)"></span>Stock</span>
          <span class="legend-item"><span class="legend-dot etf" style="width:8px;height:8px;border-radius:50%;background:var(--yellow)"></span>ETF</span>
        </div>
      </div>`;

      html += `<table class="sec-table"><thead><tr>
        <th>Ticker</th>
        <th>Name</th>
        <th class="right">Price</th>
        <th class="right">WoW</th>
        <th class="right">MTD</th>
        <th class="right">YTD</th>
        <th class="right">1Y</th>
        <th>SA Rating</th>
        <th></th>
      </tr></thead><tbody>`;

      for (const s of sec.securities) {
        const typeLower = s.type.toLowerCase();
        const perf = getSecPerf(s.ticker);

        html += `<tr>
          <td>
            <div class="sec-ticker-cell">
              <span class="security-badge ${typeLower}">${s.type}</span>
              <span class="sec-ticker">${s.ticker}</span>
            </div>
          </td>
          <td><span class="sec-name">${s.name}</span></td>
          <td class="right"><span class="sec-price">${perf ? formatSecPrice(perf.price) : '-'}</span></td>
          <td class="right">${perf ? formatSmallPct(perf.wow) : '-'}</td>
          <td class="right">${perf ? formatSmallPct(perf.mtd) : '-'}</td>
          <td class="right">${perf ? formatSmallPct(perf.ytd) : '-'}</td>
          <td class="right">${perf ? formatSmallPct(perf.oneYear) : '-'}</td>
          <td>${perf && perf.saRating ? `<span class="sa-rating ${ratingClass(perf.saRating)}">${perf.saRating}</span>` : '-'}</td>
          <td>${perf && perf.saUrl ? `<a class="sa-link" href="${perf.saUrl}" target="_blank" rel="noopener">SA &#8599;</a>` : ''}</td>
        </tr>`;
      }

      html += '</tbody></table>';

      // Data source footer
      const source = secPerfData && secPerfData.meta ? secPerfData.meta.source : 'unknown';
      const fetchedAt = secPerfData && secPerfData.meta ? new Date(secPerfData.meta.fetchedAt).toLocaleString() : '';
      html += `<div class="sec-data-source">Source: ${source === 'seeking_alpha' ? 'Seeking Alpha (Live)' : 'Sample Data'} | Updated: ${fetchedAt}</div>`;

      html += '</div></div>';
      return html;
    }

    function toggleRow(productId) {
      if (expandedRows.has(productId)) {
        expandedRows.delete(productId);
      } else {
        expandedRows.add(productId);
      }
      const panel = document.getElementById('panel-' + productId);
      const icon = document.getElementById('icon-' + productId);
      if (panel) {
        panel.classList.toggle('open');
      }
      if (icon) {
        icon.classList.toggle('open');
      }
    }

    function renderTable(filtered) {
      const container = document.getElementById('table-container');
      let html = `
        <table class="kpi-table">
          <thead>
            <tr>
              <th>Product</th>
              <th class="right">Current Price</th>
              <th class="right">vs Week Ago</th>
              <th class="right">MTD</th>
              <th class="right">YTD</th>
              <th>30D Trend</th>
            </tr>
          </thead>
          <tbody>
      `;

      for (const product of filtered) {
        const kpi = allData[product.id];
        if (!kpi) continue;
        const isOpen = expandedRows.has(product.id);

        html += `
          <tr class="product-row" onclick="toggleRow('${product.id}')">
            <td>
              <div class="product-cell">
                <span class="product-name">
                  <span class="expand-icon ${isOpen ? 'open' : ''}" id="icon-${product.id}">&#9654;</span>${product.name}
                </span>
                <span class="product-category" style="margin-left:22px">${product.category} &middot; 10 related securities</span>
              </div>
            </td>
            <td class="right">${formatPrice(kpi.currentPrice, product.unit)}</td>
            <td class="right">${formatPct(kpi.wow.pctChange)}</td>
            <td class="right">${formatPct(kpi.mtd.pctChange)}</td>
            <td class="right">${formatPct(kpi.ytd.pctChange)}</td>
            <td class="sparkline-cell"><canvas class="sparkline" data-product="${product.id}"></canvas></td>
          </tr>
          <tr class="securities-row">
            <td colspan="6">${renderSecuritiesPanel(product.id)}</td>
          </tr>
        `;
      }

      html += '</tbody></table>';
      container.innerHTML = html;

      // Draw sparklines
      container.querySelectorAll('.sparkline').forEach(canvas => {
        const pid = canvas.dataset.product;
        drawSparkline(canvas, priceHistory[pid]);
      });
    }

    function render() {
      document.getElementById('ref-date').textContent =
        `As of ${new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}`;

      renderFilters();
      const filtered = getFilteredProducts();
      renderSummary(filtered);
      renderTable(filtered);
    }

    loadData();
  </script>
</body>
</html>
