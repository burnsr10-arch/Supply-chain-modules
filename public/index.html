<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oil &amp; Energy KPI Tracker</title>
  <style>
    :root {
      --bg-primary: #0f1923;
      --bg-secondary: #1a2733;
      --bg-card: #1e2d3d;
      --border: #2a3f52;
      --text-primary: #e8edf2;
      --text-secondary: #8899aa;
      --accent: #3b82f6;
      --green: #10b981;
      --red: #ef4444;
      --yellow: #f59e0b;
      --green-bg: rgba(16, 185, 129, 0.1);
      --red-bg: rgba(239, 68, 68, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
    }

    /* TradingView Ticker Tape */
    .tv-ticker-tape {
      width: 100%;
      height: 46px;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
    }

    .header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 20px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header h1 .icon { font-size: 26px; }

    .header-meta {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .header-meta .date {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .filter-bar {
      background: var(--bg-secondary);
      padding: 12px 32px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
    }

    .filter-btn {
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .filter-btn:hover { border-color: var(--accent); color: var(--text-primary); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

    .summary-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      padding: 24px 32px;
    }

    .summary-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
    }

    .summary-card .label {
      font-size: 12px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .summary-card .value {
      font-size: 26px;
      font-weight: 700;
    }

    .summary-card .sub {
      font-size: 13px;
      margin-top: 4px;
    }

    .container {
      padding: 0 32px 32px;
    }

    .kpi-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--bg-card);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .kpi-table thead th {
      background: var(--bg-secondary);
      padding: 14px 16px;
      text-align: left;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    .kpi-table thead th.right { text-align: right; }

    .kpi-table tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }

    .kpi-table tbody tr:last-child { border-bottom: none; }
    .kpi-table tbody tr:hover { background: rgba(59, 130, 246, 0.05); }

    .kpi-table td {
      padding: 14px 16px;
      font-size: 14px;
    }

    .kpi-table td.right { text-align: right; font-variant-numeric: tabular-nums; }

    .product-cell {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .product-name { font-weight: 600; }
    .product-category { font-size: 12px; color: var(--text-secondary); }

    .price { font-weight: 600; font-size: 15px; }
    .unit { font-size: 11px; color: var(--text-secondary); margin-left: 2px; }

    .change {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
    }

    .change.up {
      color: var(--green);
      background: var(--green-bg);
    }

    .change.down {
      color: var(--red);
      background: var(--red-bg);
    }

    .change.flat {
      color: var(--text-secondary);
      background: rgba(136, 153, 170, 0.1);
    }

    .arrow { font-size: 11px; }

    .sparkline-cell {
      width: 120px;
    }

    .sparkline {
      width: 110px;
      height: 32px;
    }

    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 80px 0;
      color: var(--text-secondary);
      font-size: 16px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--text-primary);
    }

    /* Expandable securities row */
    .product-row { cursor: pointer; }
    .product-row:hover { background: rgba(59, 130, 246, 0.08) !important; }

    .expand-icon {
      display: inline-block;
      width: 16px;
      font-size: 10px;
      color: var(--text-secondary);
      transition: transform 0.2s;
      margin-right: 6px;
    }

    .expand-icon.open { transform: rotate(90deg); }

    .securities-row td {
      padding: 0 !important;
      background: var(--bg-secondary);
    }

    .securities-panel {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.4s ease;
    }

    .securities-panel.open {
      max-height: 2000px;
    }

    .securities-inner {
      padding: 16px 20px 20px;
    }

    .securities-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .securities-header h4 {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .securities-legend {
      display: flex;
      gap: 12px;
      font-size: 11px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--text-secondary);
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .legend-dot.stock { background: var(--accent); }
    .legend-dot.etf { background: var(--yellow); }

    /* TradingView mini symbol widgets */
    .tv-symbols-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .tv-symbol-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }

    .tv-symbol-card .card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }

    .security-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 22px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.3px;
      flex-shrink: 0;
    }

    .security-badge.stock { background: rgba(59, 130, 246, 0.15); color: var(--accent); }
    .security-badge.etf   { background: rgba(245, 158, 11, 0.15); color: var(--yellow); }

    .card-ticker { font-weight: 700; font-size: 14px; }
    .card-name { font-size: 12px; color: var(--text-secondary); }
    .card-exposure { font-size: 11px; color: var(--text-secondary); opacity: 0.7; margin-left: auto; max-width: 180px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .tv-widget-container {
      height: 180px;
      width: 100%;
    }

    /* TradingView detail chart area */
    .tv-detail-section {
      margin-top: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .tv-detail-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }

    .tv-detail-header span {
      font-size: 13px;
      font-weight: 600;
    }

    .tv-detail-tabs {
      display: flex;
      gap: 4px;
    }

    .tv-detail-tab {
      padding: 4px 12px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 12px;
      transition: all 0.15s;
    }

    .tv-detail-tab.active { background: var(--accent); border-color: var(--accent); color: white; }
    .tv-detail-tab:hover { border-color: var(--accent); }

    .tv-detail-chart {
      height: 400px;
      width: 100%;
    }

    .tv-source-note {
      text-align: right;
      padding: 8px 0 0;
      font-size: 11px;
      color: var(--text-secondary);
      opacity: 0.5;
    }

    @media (max-width: 768px) {
      .header { padding: 16px; }
      .summary-row { padding: 16px; }
      .container { padding: 0 16px 16px; }
      .filter-bar { padding: 10px 16px; }
      .kpi-table { font-size: 13px; }
      .kpi-table td, .kpi-table th { padding: 10px 8px; }
      .sparkline-cell { display: none; }
      .tv-symbols-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- TradingView Ticker Tape - live energy prices across the top -->
  <div class="tv-ticker-tape">
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
      {
        "symbols": [
          {"proName": "NYMEX:CL1!", "title": "WTI Crude"},
          {"proName": "NYMEX:BZ1!", "title": "Brent Crude"},
          {"proName": "NYMEX:RB1!", "title": "RBOB Gas"},
          {"proName": "NYMEX:HO1!", "title": "Heating Oil"},
          {"proName": "NYMEX:NG1!", "title": "Nat Gas"},
          {"proName": "AMEX:USO", "title": "USO"},
          {"proName": "AMEX:XLE", "title": "XLE"},
          {"proName": "NYSE:XOM", "title": "XOM"},
          {"proName": "NYSE:CVX", "title": "CVX"},
          {"proName": "NYSE:MPC", "title": "MPC"},
          {"proName": "NYSE:LNG", "title": "LNG"},
          {"proName": "NYSE:VLO", "title": "VLO"}
        ],
        "showSymbolLogo": true,
        "isTransparent": true,
        "displayMode": "adaptive",
        "colorTheme": "dark",
        "locale": "en"
      }
      </script>
    </div>
  </div>

  <div class="header">
    <h1><span class="icon">&#9951;</span> Oil &amp; Energy KPI Tracker</h1>
    <div class="header-meta">
      <span class="date" id="ref-date"></span>
    </div>
  </div>

  <div class="filter-bar" id="filter-bar"></div>

  <div class="summary-row" id="summary-row"></div>

  <div class="container">
    <h2 class="section-title">Product Performance</h2>
    <div id="table-container">
      <div class="loading">Loading KPI data...</div>
    </div>
  </div>

  <script>
    let allData = null;
    let allProducts = null;
    let priceHistory = null;
    let securitiesData = null;
    let activeFilter = 'All';
    let expandedRows = new Set();
    let loadedWidgets = new Set();

    async function loadData() {
      const [kpiRes, productRes, historyRes, secRes] = await Promise.all([
        fetch('/api/kpis'),
        fetch('/api/products'),
        fetch('/api/prices'),
        fetch('/api/securities')
      ]);
      allData = await kpiRes.json();
      allProducts = await productRes.json();
      priceHistory = await historyRes.json();
      securitiesData = await secRes.json();
      render();
    }

    function formatPct(val) {
      if (val == null) return '<span class="change flat">N/A</span>';
      const dir = val > 0.05 ? 'up' : val < -0.05 ? 'down' : 'flat';
      const arrow = dir === 'up' ? '&#9650;' : dir === 'down' ? '&#9660;' : '&#9644;';
      const sign = val > 0 ? '+' : '';
      return `<span class="change ${dir}"><span class="arrow">${arrow}</span>${sign}${val.toFixed(2)}%</span>`;
    }

    function formatPrice(price, unit) {
      if (price == null) return '-';
      const decimals = price >= 100 ? 2 : price >= 10 ? 2 : 3;
      return `<span class="price">${price.toFixed(decimals)}</span><span class="unit">${unit}</span>`;
    }

    function drawSparkline(canvas, data) {
      if (!data || data.length < 2) return;
      const ctx = canvas.getContext('2d');
      const w = canvas.width = 110;
      const h = canvas.height = 32;
      const prices = data.slice(-30).map(d => d.price);
      const min = Math.min(...prices);
      const max = Math.max(...prices);
      const range = max - min || 1;

      const isUp = prices[prices.length - 1] >= prices[0];
      ctx.strokeStyle = isUp ? '#10b981' : '#ef4444';
      ctx.lineWidth = 1.5;
      ctx.beginPath();

      prices.forEach((p, i) => {
        const x = (i / (prices.length - 1)) * w;
        const y = h - ((p - min) / range) * (h - 4) - 2;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
    }

    function getCategories() {
      return ['All', ...new Set(allProducts.map(p => p.category))];
    }

    function getFilteredProducts() {
      if (activeFilter === 'All') return allProducts;
      return allProducts.filter(p => p.category === activeFilter);
    }

    function computeSummary(filtered) {
      let gainers = 0, losers = 0, totalWow = 0, count = 0;
      for (const p of filtered) {
        const kpi = allData[p.id];
        if (!kpi || kpi.wow.pctChange == null) continue;
        if (kpi.wow.pctChange > 0.05) gainers++;
        else if (kpi.wow.pctChange < -0.05) losers++;
        totalWow += kpi.wow.pctChange;
        count++;
      }
      return {
        total: filtered.length,
        gainers,
        losers,
        avgWow: count > 0 ? totalWow / count : 0
      };
    }

    function renderFilters() {
      const bar = document.getElementById('filter-bar');
      bar.innerHTML = getCategories().map(cat =>
        `<button class="filter-btn ${cat === activeFilter ? 'active' : ''}" data-cat="${cat}">${cat}</button>`
      ).join('');
      bar.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeFilter = btn.dataset.cat;
          render();
        });
      });
    }

    function renderSummary(filtered) {
      const s = computeSummary(filtered);
      const row = document.getElementById('summary-row');
      row.innerHTML = `
        <div class="summary-card">
          <div class="label">Products Tracked</div>
          <div class="value">${s.total}</div>
          <div class="sub" style="color:var(--text-secondary)">${activeFilter === 'All' ? 'All categories' : activeFilter}</div>
        </div>
        <div class="summary-card">
          <div class="label">Weekly Gainers</div>
          <div class="value" style="color:var(--green)">${s.gainers}</div>
          <div class="sub" style="color:var(--green)">products up WoW</div>
        </div>
        <div class="summary-card">
          <div class="label">Weekly Losers</div>
          <div class="value" style="color:var(--red)">${s.losers}</div>
          <div class="sub" style="color:var(--red)">products down WoW</div>
        </div>
        <div class="summary-card">
          <div class="label">Avg Weekly Change</div>
          <div class="value">${formatPct(s.avgWow)}</div>
          <div class="sub" style="color:var(--text-secondary)">across filtered products</div>
        </div>
      `;
    }

    // Map ticker to TradingView symbol format
    function tvSymbol(ticker) {
      // ETFs on AMEX/ARCA
      const amexETFs = ['USO','BNO','DBO','UGA','UNG','BOIL','CRAK','BDRY','BOAT','SEA','JETS','AMLP','MLPA','EMLP'];
      const nyseArcaETFs = ['XLE','XOP','XLB','IEO','IYT','IYM','VDE','VAW','FILL','FENY','FCG','XEG'];
      if (amexETFs.includes(ticker)) return 'AMEX:' + ticker;
      if (nyseArcaETFs.includes(ticker)) return 'AMEX:' + ticker;
      // Known NASDAQ
      const nasdaq = ['PARR','CASY'];
      if (nasdaq.includes(ticker)) return 'NASDAQ:' + ticker;
      // Default to NYSE for stocks
      return 'NYSE:' + ticker;
    }

    function createMiniWidget(containerId, ticker) {
      if (loadedWidgets.has(containerId)) return;
      const el = document.getElementById(containerId);
      if (!el) return;

      loadedWidgets.add(containerId);

      const widget = document.createElement('div');
      widget.className = 'tradingview-widget-container';
      widget.style.height = '100%';
      widget.style.width = '100%';
      widget.innerHTML = '<div class="tradingview-widget-container__widget"></div>';

      const script = document.createElement('script');
      script.type = 'text/javascript';
      script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js';
      script.async = true;
      script.textContent = JSON.stringify({
        symbol: tvSymbol(ticker),
        width: '100%',
        height: '100%',
        locale: 'en',
        dateRange: '1M',
        colorTheme: 'dark',
        isTransparent: true,
        autosize: true,
        largeChartUrl: '',
        noTimeScale: false
      });

      widget.appendChild(script);
      el.appendChild(widget);
    }

    function createDetailChart(containerId, ticker, interval) {
      const el = document.getElementById(containerId);
      if (!el) return;
      el.innerHTML = '';

      const widget = document.createElement('div');
      widget.className = 'tradingview-widget-container';
      widget.style.height = '100%';
      widget.style.width = '100%';
      widget.innerHTML = '<div class="tradingview-widget-container__widget"></div>';

      const intervalMap = { '1W': 'D', '1M': 'D', '3M': 'W', '1Y': 'W', 'YTD': 'D' };
      const rangeMap = { '1W': '5D', '1M': '1M', '3M': '3M', '1Y': '12M', 'YTD': 'YTD' };

      const script = document.createElement('script');
      script.type = 'text/javascript';
      script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';
      script.async = true;
      script.textContent = JSON.stringify({
        autosize: true,
        symbol: tvSymbol(ticker),
        interval: intervalMap[interval] || 'D',
        timezone: 'America/New_York',
        theme: 'dark',
        style: '3',
        locale: 'en',
        backgroundColor: '#1e2d3d',
        gridColor: '#2a3f52',
        hide_top_toolbar: false,
        hide_legend: false,
        save_image: false,
        range: rangeMap[interval] || '1M',
        allow_symbol_change: true
      });

      widget.appendChild(script);
      el.appendChild(widget);
    }

    let activeDetailTicker = {};
    let activeDetailInterval = {};

    function setDetailTicker(productId, ticker) {
      activeDetailTicker[productId] = ticker;
      const interval = activeDetailInterval[productId] || '1M';
      const chartId = 'detail-chart-' + productId;
      loadedWidgets.delete(chartId);
      createDetailChart(chartId, ticker, interval);
      // Update active state on cards
      document.querySelectorAll(`.tv-symbol-card[data-product="${productId}"]`).forEach(card => {
        card.style.borderColor = card.dataset.ticker === ticker ? 'var(--accent)' : 'var(--border)';
      });
    }

    function setDetailInterval(productId, interval) {
      activeDetailInterval[productId] = interval;
      const ticker = activeDetailTicker[productId];
      if (!ticker) return;
      const chartId = 'detail-chart-' + productId;
      createDetailChart(chartId, ticker, interval);
      // Update tab styles
      document.querySelectorAll(`.tv-detail-tab[data-product="${productId}"]`).forEach(tab => {
        tab.classList.toggle('active', tab.dataset.interval === interval);
      });
    }

    function renderSecuritiesPanel(productId) {
      const sec = securitiesData[productId];
      if (!sec) return '<div class="securities-inner"><em style="color:var(--text-secondary)">No related securities data</em></div>';

      const isOpen = expandedRows.has(productId);
      let html = `<div class="securities-panel ${isOpen ? 'open' : ''}" id="panel-${productId}">`;
      html += '<div class="securities-inner">';

      // Header
      html += `<div class="securities-header">
        <h4>Top 10 Related Stocks &amp; ETFs — Live TradingView Data</h4>
        <div class="securities-legend">
          <span class="legend-item"><span class="legend-dot stock"></span>Stock</span>
          <span class="legend-item"><span class="legend-dot etf"></span>ETF</span>
        </div>
      </div>`;

      // Mini symbol overview widgets grid
      html += '<div class="tv-symbols-grid">';
      for (const s of sec.securities) {
        const typeLower = s.type.toLowerCase();
        const widgetId = `tv-mini-${productId}-${s.ticker}`;
        html += `
          <div class="tv-symbol-card" data-product="${productId}" data-ticker="${s.ticker}"
               onclick="setDetailTicker('${productId}', '${s.ticker}')" style="cursor:pointer">
            <div class="card-header">
              <span class="security-badge ${typeLower}">${s.type}</span>
              <span class="card-ticker">${s.ticker}</span>
              <span class="card-name">${s.name}</span>
              <span class="card-exposure" title="${s.exposure}">${s.exposure}</span>
            </div>
            <div class="tv-widget-container" id="${widgetId}"></div>
          </div>`;
      }
      html += '</div>';

      // Detail chart area
      const firstTicker = sec.securities[0].ticker;
      html += `
        <div class="tv-detail-section">
          <div class="tv-detail-header">
            <span id="detail-label-${productId}">Click a ticker above for detailed chart</span>
            <div class="tv-detail-tabs">
              <button class="tv-detail-tab" data-product="${productId}" data-interval="1W" onclick="setDetailInterval('${productId}','1W')">1W</button>
              <button class="tv-detail-tab active" data-product="${productId}" data-interval="1M" onclick="setDetailInterval('${productId}','1M')">1M</button>
              <button class="tv-detail-tab" data-product="${productId}" data-interval="3M" onclick="setDetailInterval('${productId}','3M')">3M</button>
              <button class="tv-detail-tab" data-product="${productId}" data-interval="YTD" onclick="setDetailInterval('${productId}','YTD')">YTD</button>
              <button class="tv-detail-tab" data-product="${productId}" data-interval="1Y" onclick="setDetailInterval('${productId}','1Y')">1Y</button>
            </div>
          </div>
          <div class="tv-detail-chart" id="detail-chart-${productId}"></div>
        </div>`;

      html += '<div class="tv-source-note">Powered by TradingView</div>';
      html += '</div></div>';
      return html;
    }

    function initWidgetsForProduct(productId) {
      const sec = securitiesData[productId];
      if (!sec) return;

      // Load mini widgets with a slight stagger to avoid overwhelming
      sec.securities.forEach((s, i) => {
        setTimeout(() => {
          createMiniWidget(`tv-mini-${productId}-${s.ticker}`, s.ticker);
        }, i * 150);
      });

      // Auto-select first ticker for detail chart
      if (!activeDetailTicker[productId]) {
        const firstTicker = sec.securities[0].ticker;
        activeDetailTicker[productId] = firstTicker;
        activeDetailInterval[productId] = '1M';
        setTimeout(() => {
          setDetailTicker(productId, firstTicker);
        }, sec.securities.length * 150 + 200);
      }
    }

    function toggleRow(productId) {
      if (expandedRows.has(productId)) {
        expandedRows.delete(productId);
      } else {
        expandedRows.add(productId);
      }
      const panel = document.getElementById('panel-' + productId);
      const icon = document.getElementById('icon-' + productId);
      if (panel) {
        panel.classList.toggle('open');
        // Load widgets when opening
        if (panel.classList.contains('open')) {
          setTimeout(() => initWidgetsForProduct(productId), 300);
        }
      }
      if (icon) {
        icon.classList.toggle('open');
      }
    }

    function renderTable(filtered) {
      const container = document.getElementById('table-container');
      loadedWidgets.clear();
      let html = `
        <table class="kpi-table">
          <thead>
            <tr>
              <th>Product</th>
              <th class="right">Current Price</th>
              <th class="right">vs Week Ago</th>
              <th class="right">MTD</th>
              <th class="right">YTD</th>
              <th>30D Trend</th>
            </tr>
          </thead>
          <tbody>
      `;

      for (const product of filtered) {
        const kpi = allData[product.id];
        if (!kpi) continue;
        const isOpen = expandedRows.has(product.id);

        html += `
          <tr class="product-row" onclick="toggleRow('${product.id}')">
            <td>
              <div class="product-cell">
                <span class="product-name">
                  <span class="expand-icon ${isOpen ? 'open' : ''}" id="icon-${product.id}">&#9654;</span>${product.name}
                </span>
                <span class="product-category" style="margin-left:22px">${product.category} &middot; 10 related securities</span>
              </div>
            </td>
            <td class="right">${formatPrice(kpi.currentPrice, product.unit)}</td>
            <td class="right">${formatPct(kpi.wow.pctChange)}</td>
            <td class="right">${formatPct(kpi.mtd.pctChange)}</td>
            <td class="right">${formatPct(kpi.ytd.pctChange)}</td>
            <td class="sparkline-cell"><canvas class="sparkline" data-product="${product.id}"></canvas></td>
          </tr>
          <tr class="securities-row">
            <td colspan="6">${renderSecuritiesPanel(product.id)}</td>
          </tr>
        `;
      }

      html += '</tbody></table>';
      container.innerHTML = html;

      // Draw sparklines
      container.querySelectorAll('.sparkline').forEach(canvas => {
        const pid = canvas.dataset.product;
        drawSparkline(canvas, priceHistory[pid]);
      });

      // Re-init widgets for already expanded rows
      for (const pid of expandedRows) {
        setTimeout(() => initWidgetsForProduct(pid), 500);
      }
    }

    function render() {
      document.getElementById('ref-date').textContent =
        `As of ${new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}`;

      renderFilters();
      const filtered = getFilteredProducts();
      renderSummary(filtered);
      renderTable(filtered);
    }

    loadData();
  </script>
</body>
</html>
